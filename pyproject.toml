[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-automator"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "PyGObject",
    "dbus-python",
    "croniter",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
workflow-automator = "src.main:main"